<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sl0p.leveler</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">sl0p<span>.leveler</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="runs">Runs</button>
    <button role="tab" data-tab="map">Map</button>
    <button role="tab" data-tab="planner">Planner</button>
    <button role="tab" data-tab="prof">Professions</button>
  </nav>
  <div class="who">
    <label>Character <select id="charPick"></select></label>
    <span id="saved" class="muted"></span>
    <button id="themeBtn" class="ghost" title="Light / dark">◐</button>
  </div>
</header>
<main id="view"></main>
<footer class="foot muted">
  Reads what the addon saves; the game writes it on <code>/reload</code> and logout, not while you play.
  Quest and item links go to <a href="https://www.wowhead.com/forever" target="_blank" rel="noopener">Wowhead (Forever)</a>.
  Routes and danger data: RestedXP Guides, CC BY-NC-SA 4.0. Profession data: ProfessionLevelingGuide, MIT.
</footer>
</body>
</html>
