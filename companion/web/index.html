<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- no Referer: Wowhead's file host refuses requests that name another site (the 3D viewer adds its stylesheet from there) -->
<meta name="referrer" content="no-referrer">
<title>zugzug_leveler</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="peon/icon.png">
<script type="importmap">{ "imports": { "three": "./vendor/three-0.170.0/three.module.min.js" } }</script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <div id="helper"></div>
  <div class="titlecard">
    <h1 class="brand">zugzug_leveler</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="character" aria-selected="true">Character</button>
      <button role="tab" data-tab="world">Map &amp; Quests</button>
      <button role="tab" data-tab="plan">Plan &amp; Runs</button>
      <button role="tab" data-tab="about">About</button>
    </nav>
  </div>
  <div class="who">
    <label>Character <select id="charPick"></select></label>
    <label>Theme <select id="themePick"></select></label>
    <span id="saved" class="muted"></span>
    <button id="phoneBtn" class="btn" type="button" aria-expanded="false">On your phone</button>
    <button id="settingsBtn" class="btn" type="button" aria-expanded="false">Settings</button>
  </div>
</header>
<section id="phone" class="phone" hidden></section>
<section id="settings" class="settings" hidden></section>
<main id="view"></main>
<footer class="foot">
  <p>The page shows what the game last saved (on /reload, logout, or the window's Sync). Not affiliated with Blizzard Entertainment. Credits, licenses and help: <a href="#about">About</a>.</p>
</footer>
</body>
</html>
